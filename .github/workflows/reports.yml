name: Reports

on:
    push:
        branches:
            - 3.x

permissions:
    contents: write

concurrency:
    group: reports
    cancel-in-progress: true

jobs:
    report:
        runs-on: ubuntu-latest

        name: Regenerate COMPATIBILITY.md and PERFORMANCE.md

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  extensions: mbstring
                  tools: composer:v2

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install Dependencies
              run: |
                  composer update --no-interaction --prefer-dist
                  npm ci

            - name: Generate compatibility report
              run: composer compatibility

            - name: Generate performance report
              run: composer performance

            # Pushes made with the workflow's token do not trigger other workflows, so this cannot loop.
            - name: Commit and push changes
              run: |
                  if git diff --quiet -- COMPATIBILITY.md PERFORMANCE.md; then
                      echo "COMPATIBILITY.md and PERFORMANCE.md are unchanged."
                      exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add COMPATIBILITY.md PERFORMANCE.md
                  git commit -m "Update $(git diff --cached --name-only | paste -sd ' ' | sed 's/ / and /')"
                  git push
